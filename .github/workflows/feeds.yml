name: OCO

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, no issue changes)"
        required: false
        default: false
        type: boolean

concurrency:
  group: package-update
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  TARGET_REPO: oSoWoSo/vOid_Community_repOsitory
  TARGET_BRANCH: OCO
  OCO_REPO: https://github.com/oSoWoSo/vOid_Community_repOsitory.git
  OCO_LABEL: package-update
  # feedsparser defaults to "feeds.opml" in its own root, which does not exist
  # here, so it would fall back to fetching the OPML from raw.githubusercontent
  # -- while the very same file sits in the OCO checkout one step up. Reading
  # the clone also closes the window where the remote OPML and the templates
  # we compare against come from two different moments in time.
  OPML_PATH: ${{ runner.temp }}/oco/src/feed.opml

jobs:
  package-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feeds
        uses: actions/checkout@v7

      - name: Checkout OCO
        run: |
          git clone \
            --depth 1 \
            --branch "$TARGET_BRANCH" \
            "$OCO_REPO" \
            "$RUNNER_TEMP/oco"

      - name: Install dependencies
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python3 -m pip install -r requirements.txt

      - name: Check package updates
        env:
          GH_TOKEN: ${{ secrets.BOT }}
          GITHUB_TOKEN: ${{ secrets.BOT }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG }}
          GITLAB_TOKEN: ${{ secrets.GITLAB }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 .github/feedsparser.py
